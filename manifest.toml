packaging_format = 2

id = "opengym"
name = "openGym"
description.en = "Self-hosted gym and body-weight tracker with passkey login"

version = "1.3.10~ynh4"

maintainers = ["quartztester"]

[upstream]
license = "AGPL-3.0-or-later"
website = "https://opengym.duarte-santos.ch"
demo = "https://opengym.duarte-santos.ch/demo/"
code = "https://github.com/DuarteSantos8/openGym"
admindoc = "https://github.com/DuarteSantos8/openGym/blob/main/docs/SELF_HOSTING.md"

[integration]
yunohost = ">= 12.0"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = "not_relevant"
sso = "not_relevant"
disk = "500M"
ram.build = "1G"
ram.runtime = "300M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    # openGym has its own passkey/password accounts (no LDAP mode), so access
    # is double-gated: YunoHost SSO decides *who may reach the page*, the app
    # decides *who may use it*. Default to portal users only.
    default = "all_users"

    [install.download_media]
    ask.en = "Download the exercise media library (~350 MB, one time)?"
    help.en = "Photos and animations for the 1,300+ exercise library, fetched from the upstream dataset. Without them the app works but shows exercises without pictures. The images are (c) GymVisual and used under the dataset's terms, not the app's AGPL."
    type = "boolean"
    default = true

[resources]
    [resources.sources.main]
    url = "https://github.com/DuarteSantos8/openGym/archive/refs/tags/v1.3.10.tar.gz"
    sha256 = "8972c53e56a6fec1f1e21737e77973d87b71b11f452940f4709f187d4e09cc2c"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    # users.json, per-user data, uploads/, session secret, VAPID keys.

    [resources.permissions]
        main.url = "/"
        # openGym authenticates with its own passkeys; no SSO injection.
        main.auth_header = false
        main.show_tile = true
        # Portal SSO walk-in (opt-in, see config panel): a second permission
        # pinned to exactly the mint route, auth_header=true. SSOwat injects
        # identity headers ONLY here — `main` stays auth_header=false so the
        # SPA's Bearer-token calls are never clobbered (the watcharr trap).
        # Non-capturing regex groups only: a capture would shorten the match
        # below `main`'s prefix and the injection would never win.
        [resources.permissions.sso]
        url = "re:^__DOMAIN__\\/(?:.*\\/)?ynh-sso-login$"
        auth_header = true
        show_tile = false
        allowed = ["all_users"]

    [resources.ports]
    main.default = 24670

    [resources.apt]
        packages = "git acl"

    [resources.nodejs]
        version = "22"
