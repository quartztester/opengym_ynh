# openGym frontend (static) + API proxy.
# Native equivalent of upstream's web/nginx.conf.template, adapted to the
# YunoHost injection layout. The app is built with vite base './' (all asset
# URLs relative), so it works under any path prefix as long as /api resolves
# relative to the page — hence both locations carry __PATH__.

# Portal SSO walk-in login (YunoHost package feature; disabled by default,
# see the app's config panel). Exact match: the auth_header-enabled `sso`
# permission covers exactly this URI and nothing else, so the app's own
# Authorization/Bearer flows elsewhere are never touched by SSOwat.
location = __PATH__/ynh-sso-login {
    content_by_lua_file __SSO_LUA__;
    more_set_headers 'Cache-Control: no-store';
}

# API (incl. /api/media/ uploads: photos/videos of custom exercises get a
# larger body cap and no request buffering, as in upstream's template).
location ^~ __PATH__/api/ {
    client_max_body_size 48m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # The API serves routes including the /api prefix (same as upstream's
    # nginx template, which forwards the full URI). Replacing the matched
    # __PATH__/api/ with /api/ strips only the YunoHost path prefix.
    proxy_pass http://127.0.0.1:__PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location __PATH__/ {
    # Upstream's own lesson: try_files inside an aliased prefix location is
    # buggy, so strip the path prefix with a rewrite and serve from root.
    # At the domain root the rewrite is a deliberate no-op, like upstream's.
    root __INSTALL_DIR__/frontend/dist;
    rewrite ^\Q__PATH__\E/(.*)$ /$1 break;
    index index.html;
    absolute_redirect off;
    # headers-more module directives: plain header directives are not
    # inherited into nested/inner locations (silently dropping inherited
    # security headers); the headers-more filter applies to responses
    # emitted by any location below.
    more_set_headers 'X-Frame-Options: DENY';
    more_set_headers 'X-Content-Type-Options: nosniff';
    more_set_headers 'Referrer-Policy: same-origin';
    more_set_headers "Content-Security-Policy: frame-ancestors 'none'";
    try_files $uri $uri/ @opengym___APP__;
}

# Upstream redirects / to the app root when a path is missed.
location @opengym___APP__ {
    return 302 __PATH__/$is_args$args;
}

# Exercise media: the stills (.webp) and animation clips (.mp4) ship inside
# the upstream source tarball at catalogue/media/ (6554 of each). The
# frontend references exercise-media/still/NNNN.webp + exercise-media/clip/
# NNNN.mp4 relative to the page, mirroring upstream's web/nginx.conf.template
# and web/Dockerfile (COPY catalogue/media/ -> html/exercise-media/).
location __PATH__/exercise-media/ {
    alias __INSTALL_DIR__/catalogue/media/;
    # Filenames are content-stable exercise ids; upstream caches immutable 30d.
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
}
