# Default (identity) map for $opengym_auth.
# opengym's nginx conf proxies `Authorization: $opengym_auth`. The variable
# is normally defined by the SSO glue map written at runtime by
# scripts/contrib/opengym-sso-link.sh (ssowat's Basic `user:-` header → the
# user's openGym bearer token). Until that script has been run (it is
# optional), this default keeps the variable defined and passes every
# Authorization header through unchanged — mobile-app bearer tokens and
# browser sessions keep working, no SSO swap happens.
# Re-running opengym-sso-link.sh overwrites this file with the real map.
map $http_authorization $opengym_auth {
    default $http_authorization;
}
